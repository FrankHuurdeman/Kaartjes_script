                var html_85e974f1b2f164c1d092d9ce00153d3d = $(`<div id="html_85e974f1b2f164c1d092d9ce00153d3d" style="width: 100.0%; height: 100.0%;">Amersfoort () is een stad en gemeente in het oosten van de Nederlandse provincie Utrecht in het midden van het land. De gemeente telt 161.852 inwoners, en heeft een totale oppervlakte van 63,86 km², waarvan 62,62 km² land en 1,24 km² water (22 november 2024). Het is qua bevolkingsaantal de tweede stad van de provincie Utrecht en de vijftiende van Nederland. Behalve de gelijknamige hoofdplaats bestaat de gemeente Amersfoort uit de kleinere kernen Hoogland en Hooglanderveen, die ondertussen in het geheel binnen het stedelijke gebied vallen. Amersfoort vervult economisch een regiofunctie, heeft een van de grootste spoorwegknooppunten van Nederland en is een belangrijke garnizoensstad. De binnenstad bezit een middeleeuws karakter met oude verdedigingswerken zoals grachten en stadsmuren.<br><img src='https://commons.wikimedia.org/wiki/Special:FilePath/https%3A//upload.wikimedia.org/wikipedia/commons/e/ee/1rightarrow_blue.svg?width=500' width='100%'></div>`)[0];

                var html_e4178979be75d473ac5527e54bbab71f = $(`<div id="html_e4178979be75d473ac5527e54bbab71f" style="width: 100.0%; height: 100.0%;">Rotterdam () is een havenstad in het westen van Nederland, in de provincie Zuid-Holland. Met 600.015 inwoners (1 januari 2023) is het de op een na grootste stad van Nederland qua inwoneraantal, na Amsterdam. De gehele gemeente Rotterdam telt 670.610 inwoners en de nog grotere metropoolregio Rotterdam Den Haag telt meer dan 2,4 miljoen inwoners. Qua oppervlakte is Rotterdam met een omvang van 319,4 km² de grootste stad van Nederland. Rotterdam dankt zijn naam aan een dam in de rivier de Rotte. De stad ligt aan de rivier de Nieuwe Maas, die gevoed wordt door water van de Rijn. De haven van Rotterdam was lange tijd de grootste ter wereld en is nog altijd de grootste en belangrijkste van Europa. Het havengebied strekt zich uit over een lengte van 40 kilometer en is een belangrijk logistiek en economisch centrum. Mede vanwege de havenindustrie heeft Rotterdam het imago van een arbeidersstad en kent de stad een zeer diverse bevolking. Nadat de historische binnenstad grotendeels verwoest werd door een Duits oorlogsbombardement in 1940, is Rotterdam een bakermat geworden voor vernieuwende architectuur, waaronder de Erasmusbrug, de Kubuswoningen en een groot aantal wolkenkrabbers. Bekendheid geniet de stad daarnaast vanwege de Erasmus Universiteit, de kunstcollecties van Museum Boijmans Van Beuningen en de Kunsthal en voetbalclubs Sparta, Excelsior en Feyenoord. In januari 1948 kreeg Rotterdam van koningin Wilhelmina toestemming de spreuk Sterker door strijd onder het gemeentewapen te voeren.<br><img src='https://commons.wikimedia.org/wiki/Special:FilePath/https%3A//upload.wikimedia.org/wikipedia/commons/e/ee/1rightarrow_blue.svg?width=500' width='100%'></div>`)[0];

                var html_a94543f219ba47eb36fcc67c0f613864 = $(`<div id="html_a94543f219ba47eb36fcc67c0f613864" style="width: 100.0%; height: 100.0%;">Maastricht (uitspraak: ; Limburgs: Mestreech /məsˈtʁeːç/; Waals: Måstraik of Li Trai) is een stad en gemeente in het zuiden van Nederland. Het is de hoofdstad van de provincie Limburg en telt 125.285 inwoners (22 november 2024, bron: CBS). Het is hiermee de grootste gemeente van de provincie Limburg. Maastricht is ontstaan bij een doorwaadbare plaats in de rivier de Maas, waaraan het zijn naam te danken heeft (Maastricht = Mosa Trajectum = doortocht door de Maas). Maastricht is al tweeduizend jaar lang ononderbroken bewoond. De stad heeft een lange en veelbewogen geschiedenis, waarvan de talrijke historische gebouwen en kunstschatten in kerken en musea getuigen. Internationaal kreeg de stad grote naamsbekendheid door het Verdrag van Maastricht (1992), dat de Europese Unie in haar huidige vorm creëerde en de weg vrijmaakte voor de invoering van de euro als Europese munt. De stad wordt in de rest van Nederland vaak gezien als "buitenlands", vooral door de perifere ligging vlak bij België en Duitsland, maar ook door het atypische landschap, de Maaslandse huizenbouw, de afwijkende geschiedenis, de ingewikkelde taalsituatie, de invloed van het katholicisme (vroeger meer dan nu), de sterke nadruk op gemeenschapsleven en folklore, en de vermeende Bourgondische leefwijze. De patroonheilige van Maastricht is Sint-Servaas.<br><img src='https://commons.wikimedia.org/wiki/Special:FilePath/https%3A//upload.wikimedia.org/wikipedia/commons/e/e4/%2522Panorama_van_op_den_Sint_Servaastoren%2522_-_Maastricht_-_20001452_-_RCE.jpg?width=500' width='100%'></div>`)[0];

                var html_ba0178304a6d4bf355f7d08b4d3978d2 = $(`<div id="html_ba0178304a6d4bf355f7d08b4d3978d2" style="width: 100.0%; height: 100.0%;">Leeuwarden (; Stadsfries en Stellingwerfs: Liwwadden of Leewadden; Fries: Ljouwert ([’ljɔ.ṷ(ə)t], [’lɔ.ṷət]), Bildts: Luwt) is een stad in Noord-Nederland en de hoofdstad van de provincie Friesland, de hoofdplaats van de gelijknamige gemeente Leeuwarden en een van de oudste steden van Noord-Nederland. Belangrijke sectoren in de stad zijn de financiële en zakelijke dienstverlening, de overheid en de non-profitsector. De stad is de grootste van de Friese elf steden. In 2023 telde de stad 95.890 inwoners. In het postcodegebied van de stad liggen de buurtschappen Barrahuis en Vierhuis. Ook verschillende andere plaatsen zijn in Leeuwarden opgenomen, zoals het voormalige dorp Huizum en de voormalige buurtschap Schilkampen.<br><img src='https://commons.wikimedia.org/wiki/Special:FilePath/https%3A//upload.wikimedia.org/wikipedia/commons/2/2d/20120519_Stadhuis_Leeuwarden_NL.jpg?width=500' width='100%'></div>`)[0];

                var html_f267ef556a87026c0f5d5e2b9a713143 = $(`<div id="html_f267ef556a87026c0f5d5e2b9a713143" style="width: 100.0%; height: 100.0%;">Amsterdam is de hoofdstad van Nederland. De stad ligt aan het IJ, het Noordzeekanaal en de monding van de Amstel in de gelijknamige gemeente Amsterdam in de provincie Noord-Holland. Amsterdam is in Nederland de stad met de meeste inwoners (918.117 op 1 januari 2023). De Metropoolregio Amsterdam telt 2,5 miljoen inwoners. Amsterdam is de op een na grootste stad van Nederland qua oppervlakte met een omvang van 219,3 km² na Rotterdam. Amsterdam dankt zijn naam aan de ligging bij een in de 13e eeuw aangelegde dam in de Amstel. De stad wordt in het Amsterdams ook Mokum genoemd, een bijnaam afkomstig uit het Jiddisch. Amsterdam staat daarnaast al sinds enkele eeuwen bekend als het 'Venetië van het Noorden', een vergelijking die te danken is aan de vele grachten en historische panden die het straatbeeld bepalen van het oude centrum. De plaats kreeg kort na 1300 stadsrechten, werd in 1345 door het Mirakel van Amsterdam een pelgrimsoord en groeide in de Gouden Eeuw uit tot een van de belangrijkste haven- en handelssteden ter wereld. Een toestroom van buitenlanders uit vooral de Zuidelijke Nederlanden, Duitsland en de Scandinavische landen leidde vanaf het eind van de 16e eeuw tot stadsuitbreidingen, waaronder de laatste grachten van de fortificatie die bekendstaat als de grachtengordel en in 2010 is toegevoegd aan de Werelderfgoedlijst. Belangrijke bezienswaardigheden in Amsterdam zijn het Rijksmuseum – bekend om de rijke collectie aan werken uit de Gouden Eeuw – het modernere Stedelijk Museum, het Van Gogh Museum en Het Scheepvaartmuseum, en het Anne Frank Huis. Cultureel beroemd zijn daarnaast het Concertgebouw, Muziekgebouw aan 't IJ en EYE Filmmuseum, evenals dierentuin Artis. Ook de Wallen, de coffeeshops en de Johan Cruijff ArenA zijn typisch Amsterdamse trekpleisters. Jaarlijks trekken deze attracties miljoenen toeristen en bezoekers naar de stad. Amsterdam telt twee universiteiten en meerdere hogescholen.<br><img src='https://commons.wikimedia.org/wiki/Special:FilePath/https%3A//upload.wikimedia.org/wikipedia/commons/e/ee/1rightarrow_blue.svg?width=500' width='100%'></div>`)[0];

                var html_9ff41648152a80cd31c220b881514af5 = $(`<div id="html_9ff41648152a80cd31c220b881514af5" style="width: 100.0%; height: 100.0%;">Zwolle () is de hoofdstad van de Nederlandse provincie Overijssel en een hanzestad. Zwolle ligt aan het Zwarte Water en de Overijsselse Vecht en is via het Zwolle-IJsselkanaal verbonden met de IJssel. De stad ligt in de regio IJsseldelta. De gemeente telt 133.141 inwoners (22 november 2024) en is qua inwoneraantal de negentiende gemeente van Nederland. Zwolle heeft een oppervlakte van 111,33 km².<br><img src='https://commons.wikimedia.org/wiki/Special:FilePath/https%3A//upload.wikimedia.org/wikipedia/commons/e/ee/1rightarrow_blue.svg?width=500' width='100%'></div>`)[0];

                var html_7c4c5eb0beef5487e5de80e8e6c52b96 = $(`<div id="html_7c4c5eb0beef5487e5de80e8e6c52b96" style="width: 100.0%; height: 100.0%;">Den Haag () is de informele naam voor 's-Gravenhage (), en is de hoofdstad van de provincie Zuid-Holland en met 566.221 inwoners (22 november 2024) de op twee na grootste gemeente van Nederland.  De stad ontstond in de middeleeuwen rond de Hofvijver en het Binnenhof, dat later het centrum van de Nederlandse politiek is geworden. Hoewel Amsterdam de eigenlijke hoofdstad van Nederland is, is Den Haag de plaats waar het parlement zetelt. Sinds augustus 1981 heeft het Nederlands koningshuis zijn hoofdresidentie in Den Haag. Ook staan de meeste ambassades, alle ministeries en de Hoge Raad in Den Haag. Daarnaast is de stad standplaats van verschillende nationale en internationale rechtscolleges, waaronder het Internationaal Gerechtshof in het Vredespaleis en het Internationaal Strafhof. Het was in 1907 gaststad van een vredesconferentie waar belangrijke internationale afspraken over het oorlogsrecht tot stand kwamen.  Van 1795 tot 1806 fungeerde Den Haag als hoofdstad van de Bataafse Republiek. Van 1806 tot 1808 was het de hoofdstad van het Koninkrijk Holland. Den Haag is de grootste Nederlandse stad aan de Noordzee en heeft een kustlijn van elf kilometer. Door de ligging is de gemeente Den Haag sinds de 19e eeuw een internationaal toeristenoord. De gemeente beschikt over twee badplaatsen: Scheveningen en Kijkduin. Daarnaast ligt een breed zandstrand met een duinenrij: een omvangrijk natuurgebied. Scheveningen – vroeger een vissersdorp – heeft bovendien een regionale haven. De stad bracht in de 19de eeuw een invloedrijke kunststroming voort, de Haagse School, en huisvest met het Mauritshuis en het Kunstmuseum Den Haag (voor moderne kunst) twee internationaal bekende kunstmusea. Sinds 1 januari 2015 vormt Den Haag met 22 andere gemeenten samen de Metropoolregio Rotterdam Den Haag. Het gebied van dit samenwerkingsverband telt gezamenlijk 2,3 miljoen inwoners. Deze regio maakt op haar beurt weer deel uit van de Randstad, de sterk verstedelijkte conurbatie in het westen van Nederland.<br><img src='https://commons.wikimedia.org/wiki/Special:FilePath/https%3A//upload.wikimedia.org/wikipedia/commons/6/6f/1574-10-03%253B_Haghe%252C_Leyden%252C_Delft_%2528Siege_of_Leiden%2529.jpg?width=500' width='100%'></div>`)[0];

                var html_d2a4d67b61c6921080bc575eb3743287 = $(`<div id="html_d2a4d67b61c6921080bc575eb3743287" style="width: 100.0%; height: 100.0%;">Hilversum () is een stad en gemeente in de Nederlandse provincie Noord-Holland en de grootste plaats in de landstreek het Gooi. Hilversum huisvest veel landelijke omroepbedrijven en wordt ook wel aangeduid als de 'mediastad'. Met 'Hilversum' worden ook wel de omroepactiviteiten bedoeld. De gemeente Hilversum heeft 94.435 inwoners (22 november 2024 bron: CBS) op een oppervlakte van 46,19 km² (waarvan 0,21 km² water). Na een aanvankelijk voorspoedige groei daalde het inwonertal van de stad in de tweede helft van de 20ste eeuw aanzienlijk, van 100.000 in 1958 tot minder dan 80.000 in 1999 (bron: CBS). De gemeente duidde zichzelf ook aan als 'tuinstad', vanwege de groene omgeving die deel uitmaakt van Goois Natuurreservaat en in wijdere zin van het Groene Hart, en vanwege de in de twintigste eeuw ontworpen tuinwijken voor arbeiders. Vanwege het relatief grote aantal villa's duidde ze zich ook aan als 'villadorp'<br><img src='https://commons.wikimedia.org/wiki/Special:FilePath/https%3A//upload.wikimedia.org/wikipedia/commons/6/6b/403_Hilversum.ogg?width=500' width='100%'></div>`)[0];

                var html_05c834b58da7f804f1bd5f18fdae3cb2 = $(`<div id="html_05c834b58da7f804f1bd5f18fdae3cb2" style="width: 100.0%; height: 100.0%;">Hamburg (Duits, officieel: Freie und Hansestadt Hamburg, Nedersaksisch: Hamborg [ˈhaˑmbɔːχ]) is een kreisfreie Stadt en metropool in Duitsland. Het is de op een na grootste stad van het land en tevens de belangrijkste havenstad: de rivier de Elbe verbindt Hamburg met de Noordzee. De stad maakt geen deel uit van een deelstaat, maar vormt er zelf een. Binnen de officiële grenzen, die ongeveer 755 km² omsluiten, wonen 1.904.444 inwoners (31 december 2020). In aangrenzende stedelijke gebieden wonen er nog eens 750.000. In de Metropoolregio Hamburg wonen op ruim 26.000 km² vijf miljoen mensen. Op 31 december 2018 had 15,87% van de inwoners een niet-Duits staatsburgerschap (302.265 niet-Duitsers) en hadden 2.610 inwoners het Nederlandse staatsburgerschap. Hamburg kent diverse vormen van industrie, en heeft een metro en vliegvelden (Flughafen Hamburg). De Alter Elbtunnel (1911) was de eerste rivierondertunneling op het Europese continent. Er zijn diverse wetenschappelijke instellingen, onder andere een universiteit, twee Max-Planck-Instituten en DESY. De meeste historische gebouwen zijn in de Tweede Wereldoorlog verwoest tijdens het bombardement op Hamburg.<br><img src='https://commons.wikimedia.org/wiki/Special:FilePath/https%3A//upload.wikimedia.org/wikipedia/commons/5/56/1730_Hamburg_Covens_%2526_Mortier.JPG?width=500' width='100%'></div>`)[0];

                var html_a24166472f0ddb5a3d6721f582921f02 = $(`<div id="html_a24166472f0ddb5a3d6721f582921f02" style="width: 100.0%; height: 100.0%;">Berlijn (Duits: Berlin) is de hoofdstad van Duitsland en als stadstaat een deelstaat van dat land. Met 3.866.385 inwoners (30 juni 2023) is Berlijn tevens de grootste stad van het land. Daarnaast is Berlijn – gerekend naar inwonertal binnen de stadsgrenzen – de grootste stad van de Europese Unie. De stad ligt in het noordoosten van Duitsland aan de rivier de Spree. 22% van Berlijn bestaat uit natuur en parken en 6% uit meren, rivieren en kanalen. Ze wordt omsloten door de deelstaat Brandenburg. Op 31 december 2018 had 17,46% van de inwoners een niet-Duits staatsburgerschap (675.210 niet-Duitsers) en hadden 8.195 inwoners het Nederlandse staatsburgerschap. In zijn geschiedenis, die teruggaat tot de dertiende eeuw, was Berlijn de hoofdstad van Pruisen (1701–1918), het Duitse Keizerrijk (1871–1918), de Weimarrepubliek (1919–1933) en nazi-Duitsland (1933–1945). Na de Tweede Wereldoorlog was Berlijn gedurende meer dan veertig jaar een verdeelde stad, waarbij het oostelijke deel als hoofdstad fungeerde van de DDR en het westelijke deel een de facto exclave van West-Duitsland was. Na de Duitse hereniging in 1990 werd Berlijn de hoofdstad van de Bondsrepubliek Duitsland en de zetel van het parlement, de deelstaatvertegenwoordiging en het staatshoofd. De economie is voornamelijk gebaseerd op de high-tech industrie en de dienstensector, die een diverse waaier van creatieve industrie, onderzoeksfaciliteiten en media bedrijven. Berlijn dient ook als continentale hub voor lucht-en spoorvervoer en is een toeristische bestemming. Belangrijke industrieën omvatten electronic commerce, IT, biomedische techniek, geneesmiddelen, biotechnologie, elektronica, verkeerstechniek, en hernieuwbare energie. Berlijn is een metropool en geldt in Europa als een van de grootste culturele, politieke en wetenschappelijke centra. De stad is bekend vanwege het hoogontwikkelde culturele leven (festivals, nachtleven, sportevenementen, musea, kunsttentoonstellingen enz.) en de liberale levensstijl en moderne Zeitgeist.<br><img src='https://commons.wikimedia.org/wiki/Special:FilePath/https%3A//upload.wikimedia.org/wikipedia/commons/e/ee/1rightarrow_blue.svg?width=500' width='100%'></div>`)[0];

                var html_1977dc66a3db03c2835c9376ad4703a7 = $(`<div id="html_1977dc66a3db03c2835c9376ad4703a7" style="width: 100.0%; height: 100.0%;">Trier (Frans: Trèves, Luxemburgs: Tréier, Latijn: Augusta Treverorum) is, samen met Worms, de oudste stad van Duitsland en ook het oudste bisdom ten noorden van de Alpen. De kreisvrije stad Trier ligt op de rechteroever van de Moezel. De stad telt 110.674 inwoners (31 december 2020) op een oppervlakte van 117,13 km².  De opdracht tot de bouw van de stad werd gegeven door de Romeinse keizer Augustus in 16 v.Chr. De stad heette oorspronkelijk Augusta Treverorum en was bedoeld als hoofdstad van de Romeinse provincie Belgica Prima. Een historisch monument in de stad is de 2e-eeuwse Porta Nigra, de best bewaarde Romeinse stadspoort ten noorden van de Alpen. Er zijn nog verschillende andere monumenten uit de Romeinse tijd, bv. de Basilica, de Keizerthermen, de Barbarathermen en het amfitheater. Ook uit latere perioden heeft Trier veel monumenten, waaronder de 11e- tot 18e-eeuwse Dom waarvan de bouw reeds in de 4e eeuw begon, en vele andere kerken. De Romeinse monumenten, de Dom en de Onze-Lieve-Vrouwekerk zijn sinds 1986 geklasseerd als UNESCO-werelderfgoed. Door zijn rijke verleden en vanwege zijn ligging in het Moezeldal heeft Trier een aantrekkingskracht onder toeristen. De stad is daarnaast een centrum van wijnhandel en heeft een belangrijke functie als winkelcentrum voor een grote regio en als studentenstad: er wonen behalve Duitse ook veel Luxemburgse studenten. Tevens is Trier bekend als geboorteplaats van Karl Marx. Zijn geboortehuis is sinds lang ingericht als museum: het Karl Marx-huis. De Heilige Eucharius is de patroonheilige van de stad.<br><img src='https://commons.wikimedia.org/wiki/Special:FilePath/https%3A//upload.wikimedia.org/wikipedia/commons/e/ee/1rightarrow_blue.svg?width=500' width='100%'></div>`)[0];

                var html_a879663cd744b3aa8eadd084d5eab3ad = $(`<div id="html_a879663cd744b3aa8eadd084d5eab3ad" style="width: 100.0%; height: 100.0%;">Brugge (Frans en Engels: Bruges; Duits: Brügge) is de hoofdstad en naar inwonertal grootste stad van de Belgische provincie West-Vlaanderen en van het arrondissement Brugge. De centrumstad, gelegen in het noordwesten van het land, is tevens de hoofdplaats van het kieskanton Brugge, telt zelf vier gerechtelijke kantons en is de zetel van het bisdom Brugge en van een hof van assisen. Het historisch centrum is als middeleeuwse stad opgenomen op de werelderfgoedlijst van UNESCO. Het is eivormig en ongeveer 430 hectare groot. De volledige gemeente heeft een oppervlakte van ruim 14.099 hectare, waaronder zo'n 1.075 hectare gewonnen op de zee, bij Zeebrugge. De stad telt circa 120.000 inwoners; ongeveer 20.000 daarvan wonen in de binnenstad. De inwoners van Brugge worden Bruggelingen genoemd. De economische betekenis van Brugge vloeit voornamelijk voort uit de zeehaven, Zeebrugge, maar ook uit de industrie, dienstensector en scholen op alle niveaus. Tevens is de stad een wereldberoemde toeristische trekpleister.<br><img src='https://commons.wikimedia.org/wiki/Special:FilePath/https%3A//upload.wikimedia.org/wikipedia/commons/e/ee/1rightarrow_blue.svg?width=500' width='100%'></div>`)[0];

                var html_c5d4c9dde95fc86b9df3ae9e21e1fabe = $(`<div id="html_c5d4c9dde95fc86b9df3ae9e21e1fabe" style="width: 100.0%; height: 100.0%;">Londen (Engels: London) is de hoofdstad en grootste stad van zowel Engeland als het Verenigd Koninkrijk. In de regio Groot-Londen, waarvan de begrenzing vaak gelijk wordt gesteld aan die van de stad Londen, wonen 8,8 miljoen mensen. De Metropoolregio Londen omvat het gehele verstedelijkte gebied wat nog veel verder strekt en heeft 15,1 miljoen inwoners. Tussen 1831 en 1925 was Londen de grootste stad ter wereld. De stad is, behalve de hoofdstad en de grootste stad van het Verenigd Koninkrijk, ook het politieke, economische en culturele centrum van dat land. Ook in Europa en de wereld vervult ze een belangrijke functie op diverse gebieden: Londen wordt als een van de vier traditionele alfa-wereldsteden beschouwd, samen met Parijs, Tokio en New York. Vooral in de 18e en de 19e eeuw was Londen als hoofdstad van het Britse Rijk het absolute politieke en economische machtscentrum van de wereld. Londen telt vier plaatsen die op de Werelderfgoedlijst van de UNESCO staan: de Tower of London, de historische nederzetting van Greenwich, de Kew Gardens, en een gezamenlijke inschrijving bestaande uit het Palace of Westminster, Westminster Abbey en Saint Margaret's Church.<br><img src='https://commons.wikimedia.org/wiki/Special:FilePath/https%3A//upload.wikimedia.org/wikipedia/commons/e/ee/1rightarrow_blue.svg?width=500' width='100%'></div>`)[0];

                var html_136e568d0405a37a6d7d5bee98b027b5 = $(`<div id="html_136e568d0405a37a6d7d5bee98b027b5" style="width: 100.0%; height: 100.0%;">Avignon is een stad aan de Rhône in het zuiden van Frankrijk. Avignon is de prefectuur van het departement Vaucluse. De stad telde 91.760 inwoners op 1 januari 2022, die Avignonnais worden genoemd. Het is de gemeente met de meeste inwoners van het departement. Avignon heeft de bijnamen "Babylon aan de Rhône" omwille van de Babylonische ballingschap der pausen, alsook "Provençaalse pausenstad". Pausen verbleven in Avignon tussen 1309 en 1423. Avignon is al eeuwen de zetel van een aartsbisschop. Het historische centrum (aangeduid met "intra-muros") is omgeven door 14e-eeuwse vestingmuren van 4,2 kilometer lang met zeven poorten en 39 torens. Belangrijke monumenten zijn het Pausenpaleis, de Rocher des Doms en de Pont d'Avignon. Het centrum staat sinds 1995 op de Werelderfgoedlijst van UNESCO.<br><img src='https://commons.wikimedia.org/wiki/Special:FilePath/https%3A//upload.wikimedia.org/wikipedia/commons/e/ee/1rightarrow_blue.svg?width=500' width='100%'></div>`)[0];

                var html_3db4b6ada780e40c3570cc840b4b7836 = $(`<div id="html_3db4b6ada780e40c3570cc840b4b7836" style="width: 100.0%; height: 100.0%;">Barcelona is de op een na grootste stad van Spanje, na de hoofdstad Madrid. De stad is de hoofdstad van de autonome regio Catalonië en van de provincie Barcelona. Barcelona telt 1.636.732 inwoners (2021) en heeft een oppervlakte van 101,4 km². In de metropolitane regio wonen circa 6,8 miljoen mensen (2017). De stad ligt aan de Middellandse Zee, aan de Costa del Maresme, tussen de Costa Brava in het noorden en de Costa del Garraf in het zuiden. Barcelona beschikt over een belangrijke zee- en handelshaven en ligt op ongeveer 160 kilometer van de Pyreneeën. Barcelona is een belangrijk cultureel en academisch centrum. De Universiteit van Barcelona werd opgericht in 1450 en de Universiteit Pompeu Fabra in 1990. De stad organiseerde meerdere internationale evenementen, waaronder de Wereldtentoonstellingen van 1888 en 1929, de Olympische Zomerspelen van 1992 en het Fòrum van 2004. Een groot deel van de stad, het district Eixample, werd in de 19e eeuw ontworpen met een kenmerkend rasterpatroon. Inwoners noemen de stad vaak 'Barna', terwijl 'Barça' verwijst naar de voetbalclub FC Barcelona.<br><img src='https://commons.wikimedia.org/wiki/Special:FilePath/https%3A//upload.wikimedia.org/wikipedia/commons/c/cb/046_La_Casa_dels_Entremesos_%2528Barcelona%2529%252C_gegants.jpg?width=500' width='100%'></div>`)[0];

                var html_cf1862c3ac122d0a108b343179a94de3 = $(`<div id="html_cf1862c3ac122d0a108b343179a94de3" style="width: 100.0%; height: 100.0%;">Feltre is een stad in de Noord-Italiaanse regio Veneto, in de provincie Belluno. De stad ligt aan de rivier de Stizzon die enkele kilometers verder samenstroomt met de rivier de Piave. Ten noorden van Feltre ligt het ongerepte Nationaal Park Dolomiti Bellunesi. De Romeinen stichtten de stad onder de naam Feltria, maar waarschijnlijk was de zone al daarvoor bewoond. Gedurende de Middeleeuwen behoorde Feltre lange tijd toe aan de Republiek Venetië. In de Eerste Wereldoorlog lag in Feltre een Oostenrijks vliegveld. Het Flik 60J opereerde vanuit Feltre. Feltre is verdeeld in een onder- en een bovenstad. Het oudste deel, de bovenstad, is nog omgeven door muren. Karakteristiek voor de stad zijn de arcadegalerijen. Het Piazza Maggiore is het hart van de stad, hieraan staat het stadhuis en een zuil met daarop de leeuw van Venetië. Een belangrijk jaarlijks terugkerend evenement in Feltre is de Palio. Sinds 1979 strijden vier stadsdelen iedere zomer om de overwinning.<br><img src='https://commons.wikimedia.org/wiki/Special:FilePath/https%3A//upload.wikimedia.org/wikipedia/commons/4/4a/Commons-logo.svg?width=500' width='100%'></div>`)[0];

                var html_ecad6f1b54067f9be024b4375a1c99da = $(`<div id="html_ecad6f1b54067f9be024b4375a1c99da" style="width: 100.0%; height: 100.0%;">Zagreb ([ˈzɑː.greb]) (Hongaars: Zágráb)  is de hoofdstad en grootste stad van Kroatië en van de provincie Zagreb. De stad ligt in het noorden van het land, dicht bij de grens met Slovenië. In 2011 telde Zagreb 709.017 inwoners. De stad Zagreb ligt aan de rivier de Sava en aan de voet van het gebergte Medvednica aan de rand van de Pannonische vlakte. Bestuurlijk vormt Zagreb een afzonderlijke provincie met circa 1.200.000 inwoners en het is tevens het bestuurscentrum van de provincie die de omgeving omvat (Zagrebačka županija). Groot-Zagreb huisvest ongeveer een op de vijf inwoners van Kroatië. Zagreb heeft diverse musea, waaronder het archeologisch museum, het Kroatische museum van natuurwetenschappen en het museum voor moderne kunsten.<br><img src='https://commons.wikimedia.org/wiki/Special:FilePath/https%3A//upload.wikimedia.org/wikipedia/commons/e/ee/1rightarrow_blue.svg?width=500' width='100%'></div>`)[0];

                var html_6badbc8ea3fa74a38d2f890984e33017 = $(`<div id="html_6badbc8ea3fa74a38d2f890984e33017" style="width: 100.0%; height: 100.0%;">Split (Italiaans: Spalato; Hongaars: Spalató) is de grootste en belangrijkste stad in Dalmatië. De stad had in 2021 160.577 inwoners en is daarmee de tweede stad van Kroatië. De havenstad is gelegen op een klein schiereiland in de Adriatische Zee en is een belangrijke economische en toeristische transitstad. Vanuit de haven kunnen namelijk meerdere Adriatische eilanden en Italiaanse steden worden bereikt. De stad is de belangrijkste stad in zuidelijk Kroatië en wordt in de volksmond de hoofdstad van Dalmatië genoemd, hoewel het officieel slechts de status heeft van hoofdplaats van de provincie Split-Dalmatië. De belangrijkste economische activiteit in Split is het toerisme. Daarnaast zijn visserij, wijnbouw en chemische industrie belangrijk. Het is ook een belangrijk verkeersknooppunt voor Dalmatië, doordat veel van de Dalmatische eilanden uitsluitend vanuit de haven van Split bereikbaar zijn. Het eiland Brač ligt tegenover de stad Split. Aan de westrand van het centrum ligt de beboste heuvel Marjan, met daarop enkele kerkjes, een dierentuin en een begraafplaats.<br><img src='https://commons.wikimedia.org/wiki/Special:FilePath/https%3A//upload.wikimedia.org/wikipedia/commons/b/b6/Coat_of_arms_of_Split.svg?width=500' width='100%'></div>`)[0];

                var html_4bd14faf8df897518dc4dc1a65d0f527 = $(`<div id="html_4bd14faf8df897518dc4dc1a65d0f527" style="width: 100.0%; height: 100.0%;">Wrocław (; Duits: Breslau, Silezisch-Duits: Brassel, Jiddisch: Bresle;  Tsjechisch: Vratislav; Latijn: Vratislavia) is een stad in Centraal-Europa in het zuidwesten van Polen, gelegen aan de rivier de Oder. In Wrocław kruisten twee handelsroutes: Via Regia en de Barnsteenroute. De stad behoorde tot de Hanze. Wrocław is de belangrijkste historische stad van Silezië en was de hoofdstad van de Pruisische later Duitse provincie Neder-Silezië. Sinds 1999 is Wrocław de hoofdstad van het Poolse woiwodschap Neder-Silezië. Tevens is het een bisschopsstad. Wrocław telt 673.743 inwoners (31.12.2023), waarmee het de derde stad van Polen is. In 1871 was het als Breslau de derde stad van Duitsland, na Berlijn en Hamburg.<br><img src='https://commons.wikimedia.org/wiki/Special:FilePath/https%3A//upload.wikimedia.org/wikipedia/commons/e/ee/1rightarrow_blue.svg?width=500' width='100%'></div>`)[0];

                var html_9923f1bd9586c4fa65da59d4d8fe921d = $(`<div id="html_9923f1bd9586c4fa65da59d4d8fe921d" style="width: 100.0%; height: 100.0%;">Storlien is een plaats in de gemeente Åre in het Zweedse landschap Jämtland en de provincie Jämtlands län. De plaats heeft 97 inwoners (2005) en een oppervlakte van 23 hectare. Storlien ligt op een kilometer afstand van de grens met Noorwegen en langs het dorp loopt de Europese weg 14. Vroeger was er een sanatorium. In de buurt liggen verschillende gebergten. Veel van de bergtoppen liggen boven de boomgrens en de hoogste bergtoppen in de buurt van de plaats liggen op ongeveer 1450 meter boven de zeespiegel. De plaats is een wintersportplaats, er wordt veel aan langlaufen en alpineskiën gedaan. In het skigebied Storlien, dat bij de plaats ligt, zijn in totaal 23 skipistes te vinden en negen skiliften. Het dorp Storlien is populair bij toeristen uit Noorwegen. De Zweedse koninklijke familie heeft een huis in Storlien waarin ze gewoonlijk pasen vieren. Storliens skigebied heeft 9 liften en 23 afdalingen. Hoewel de naam Storlien 'grote heuvel' betekent, stijgt de heuvel maar 190 meter wat tot gevolg heeft dat de afdalingen in vergelijking met andere skigebieden kort zijn.  Het station Storlien ligt 592 meter boven de zeespiegel en is hiermee het hoogstgelegen treinstation van Zweden. De spoorlijnen Spoorlijn Trondheim - Storlien en Spoorlijn Storlien - Sundsvall eindigen en beginnen in het dorp. Vanaf het station rijden regionale treinen van Vy naar Trondheim en regionale treinen van Norrtåg naar Östersund en Sundsvall, beide twee keer per dag, op elkaar aansluitend. In het verleden reden er ook nachttreinen naar o.a. Stockholm en Malmö.<br><img src='https://commons.wikimedia.org/wiki/Special:FilePath/https%3A//upload.wikimedia.org/wikipedia/commons/4/4c/Flag_of_Sweden.svg?width=500' width='100%'></div>`)[0];

                var html_4e92cf352376256a64f665d1bee5315b = $(`<div id="html_4e92cf352376256a64f665d1bee5315b" style="width: 100.0%; height: 100.0%;">Flåm is een dorp in Noorwegen met zo'n 500 inwoners, onderdeel van de gemeente Aurland in de provincie Vestland. Het dorp ligt aan het einde van de Aurlandsfjord, een arm van de Sognefjord. De autoweg E16 tussen Oslo en Bergen loopt door Flåm. De naam "Flåm" betekent "klein plat gedeelte tussen steile bergen". Het dorp is al sinds eind 19e eeuw een populaire bestemming voor toeristen die de Noorse fjorden en natuur bezoeken. Flåm ontvangt ongeveer een half miljoen bezoekers per jaar. Een belangrijke attractie is de Flåmsbana-treinbaan tussen Flåm en Myrdal, een van de steilste treintrajecten ter wereld. Verder doen zo'n 115 cruiseschepen per jaar de haven van Flåm aan. Ook de Rallarvegen, de weg tussen Finse en Flåm, is populair bij toeristen, vooral bij fietsers. In een voormalig stationsgebouw van Flåm is een museum over de Flåmsbana-treinbaan gevestigd.<br><img src='https://commons.wikimedia.org/wiki/Special:FilePath/https%3A//upload.wikimedia.org/wikipedia/commons/5/56/00_2795_Fl%25C3%25A5m%252C_a_place_in_Norway.jpg?width=500' width='100%'></div>`)[0];
